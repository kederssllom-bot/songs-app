name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          mkdir /tmp/src
          cp -r lib pubspec.yaml /tmp/src/
          flutter create --platforms=android --org com.songs --project-name songs_app .
          rm -rf lib pubspec.yaml
          cp -r /tmp/src/lib /tmp/src/pubspec.yaml .

      - name: Add permissions and app name
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="أغاني"|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: songs-apk
          path: build/app/outputs/flutter-apk/app-release.apk
