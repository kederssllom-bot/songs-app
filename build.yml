name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          mkdir /tmp/src
          cp -r lib pubspec.yaml /tmp/src/
          flutter create --platforms=android --org com.songs --project-name songs_app .
          rm -rf lib pubspec.yaml
          cp -r /tmp/src/lib /tmp/src/pubspec.yaml .

      - name: Patch Android manifest and activity
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="أغاني"', s, count=1)
          perms = (
            '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>'
            '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
            '<uses-permission android:name="android.permission.WAKE_LOCK"/>'
            '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>'
            '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>'
            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          )
          services = (
            '<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable">'
            '<intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>'
            '</service>'
            '<receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable">'
            '<intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>'
            '</receiver>'
          )
          s = s.replace('<application', perms + '<application', 1)
          s = s.replace('</application>', services + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          mkdir -p android/app/src/main/kotlin/com/songs/songs_app
          cat > android/app/src/main/kotlin/com/songs/songs_app/MainActivity.kt <<'EOF'
          package com.songs.songs_app

          import com.ryanheise.audioservice.AudioServiceActivity

          class MainActivity : AudioServiceActivity()
          EOF

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: songs-apk
          path: build/app/outputs/flutter-apk/app-release.apk
